<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cedar Lane Auto Detailing – Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 65vh; overflow-y: auto; padding: 12px; }
  .m { margin: 8px 0; white-space: pre-wrap; }
  .user { text-align: right; } .user span { background: #dbeafe; }
  .agent span { background: #f1f5f9; }
  .m span { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; text-align: left; }
  .tool { font: 11px monospace; color: #475569; margin: 4px 0 4px 12px; background: #f8fafc; border-left: 3px solid #94a3b8; padding: 4px 8px; border-radius: 4px; }
  form { display: flex; gap: 8px; margin-top: 8px; } input { flex: 1; padding: 10px; }
</style>
</head>
<body>
<h3>Cedar Lane Auto Detailing</h3>
<div id="log"></div>
<form id="f">
  <input id="t" placeholder="Type a message…" autocomplete="off" autofocus>
  <button>Send</button>
  <button type="button" id="end">End chat</button>
  <label style="font-size:12px; color: #64748b; cursor: pointer;"><input type="checkbox" id="showTools"> show tool calls</label>
</form>
<script>
let sid = crypto.randomUUID();
const log = document.getElementById('log'), t = document.getElementById('t');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'm ' + cls;
  const s = document.createElement('span'); s.textContent = text; d.appendChild(s);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function tools(list) {
  if (!document.getElementById('showTools').checked) return;
  for (const x of list || []) {
    const d = document.createElement('div'); d.className = 'tool';
    d.textContent = '⚙ ' + x.tool + ' ' + JSON.stringify(x.args);
    log.appendChild(d);
  }
}
async function post(path, message, explicitSessionId) {
  const currentSession = explicitSessionId || sid;
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: currentSession, message})
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

const sendBtn = document.querySelector('#f button:not(#end)');
const endBtn = document.getElementById('end');

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = t.value.trim();
  if (!msg) return;

  t.value = '';
  t.disabled = true;
  if (sendBtn) sendBtn.disabled = true;

  add('user', msg);
  add('agent', '… (thinking)');

  try {
    const r = await post('/api/chat', msg);
    log.lastChild.remove();
    tools(r.tools);
    if (r.reply) { add('agent', r.reply); }
  } catch (err) {
    log.lastChild.remove();
    add('agent', 'Error: ' + err.message);
  } finally {
    t.disabled = false;
    if (sendBtn) sendBtn.disabled = false;
    t.focus();
  }
};

endBtn.onclick = async () => {
  if (endBtn.disabled) return;
  endBtn.disabled = true;
  endBtn.textContent = 'Ending…';

  const endingSid = sid;
  sid = crypto.randomUUID(); // Immediately start fresh session for subsequent chat

  try {
    const r = await post('/api/end', '', endingSid);
    tools(r.tools);
  } catch (err) {
    console.warn('End chat error:', err);
  } finally {
    add('agent', '— chat ended & logged. New conversation started —');
    endBtn.disabled = false;
    endBtn.textContent = 'End chat';
    t.focus();
  }
};
</script>
</body>
</html>
